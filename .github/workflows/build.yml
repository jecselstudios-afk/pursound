name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: unzip -q ./PurpurSound-source.zip
      - run: mvn -B package
        working-directory: PurpurSound
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: PurpurSound-jar
          path: PurpurSound/target/*.jar
